project_name: ScraperHU
language_servers:
- python
encoding: utf-8
activation_command: null
activation_command_timeout: 180.0
line_ending: null
language_backend: null
agent_interface: null
ignore_all_files_in_gitignore: true
ls_specific_settings: {}
ls_workspace_folders:
- .
ls_additional_workspace_folders: []
ignored_paths:
- __pycache__/**
- .pytest_cache/**
- .venv/**
- venv/**
- Output/**
- Input/**
- ImageRepo/**
- ImageTags/**
- drivers/**
- logs/**
- '*profile*/**'
- '*Profile*/**'
- .code-graph/**
- .serena/cache/**
- .git/**
- '*.log'
- '*.db'
- '*.sqlite'
- '*.mp3'
- '*.wav'
- '*.png'
- '*.jpg'
- '*.jpeg'
- .DS_Store
read_only: false
excluded_tools:
- create_text_file
- read_file
- execute_shell_command
- find_file
- list_dir
- search_for_pattern
- onboarding
included_optional_tools: []
fixed_tools: []
excluded_apis: []
included_apis: []
default_modes: null
added_modes:
- no-onboarding
initial_prompt: 'TOKEN EFFICIENCY & CODE INTELLIGENCE PROTOCOL:

  1. Discovery: Use get_symbols_overview for high-level structure, then find_symbol
  (with include_body=true) for specific functions/classes.

  2. Search: Prefer XERJ (xerj def, xerj search passage) for finding definitions and
  compact passages without loading entire files.

  3. Avoid reading full large files or raw data dumps when targeted symbol retrieval
  suffices.

  4. Editing: Prefer targeted AST editing (replace_symbol_body, insert_after_symbol)
  or replace_content instead of whole-file overwrites.

  '
symbol_info_budget: 5.0
read_only_memory_patterns: []
ignored_memory_patterns: []
